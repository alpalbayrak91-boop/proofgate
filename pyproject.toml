[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgate"
version = "0.1.0"
description = "Zero-dependency Lean 4 specification-faithfulness gate, Python AST verifier, and RFC 6962 / RFC 8785 cryptographic receipt toolkit"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alp Albayrak" }]
requires-python = ">=3.10"
keywords = ["lean4", "formal-verification", "ast", "rfc6962", "merkle-tree", "jcs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
proofgate = "proofgate.cli:main"

[tool.setuptools.packages.find]
include = ["proofgate*"]
