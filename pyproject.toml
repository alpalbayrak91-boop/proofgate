[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgate"
version = "1.0.0"
description = "Zero-dependency Omni-Gate verification toolkit: Lean 4 faithfulness/vacuity/diff gates, Python AST verifier, SARIF v2.1.0, RFC 6962/8785, SLSA v1.0 DSSE, and non-compensatory multi-agent evaluation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alp Albayrak" }]
requires-python = ">=3.10"
keywords = ["lean4", "formal-verification", "ast", "rfc6962", "merkle-tree", "jcs", "sarif", "slsa", "in-toto", "dsse", "agent-eval"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
proofgate = "proofgate.cli:main"

[tool.setuptools.packages.find]
include = ["proofgate*"]
